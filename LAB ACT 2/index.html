<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Interactive Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Welcome to My Page!</h1>

        <p id="message">
            Hello! Welcome to our webpage.
        </p>

        <div class="buttons">
            <button id="changeMessageBtn">
                Change Message
            </button>

            <button id="changeBgBtn">
                Change Background
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
